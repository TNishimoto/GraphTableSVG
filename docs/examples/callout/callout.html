<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Callout Samples</title>
    <script src="../../scripts/graph_table_svg.js"></script>
    <script>
        window.onload = () => {
            GraphTableSVG.Options.openSVG();
            /* This comment is a landmark for data processing. */
        };
    </script>
</head>

<body>
    <svg id="main" width="600px" height="600px" xmlns="http://www.w3.org/2000/svg" style="background:#e9e9e9;border:solid 1pt;">
        <z-callout data-x="100" data-y="100" data-speaker-x="100" data-speaker-y="50">
            <t>speaker-x="100"</t>
            <t>speaker-y="50"</t>
        </z-callout>
        <z-callout data-x="300" data-y="100" data-speaker-x="400" data-speaker-y="50">
            <t>speaker-x="400"</t>
            <t>speaker-y="50"</t>
        </z-callout>
        <z-callout data-x="100" data-y="200" data-speaker-x="50" data-speaker-y="200">
            <t>speaker-x="50"</t>
            <t>speaker-y="200"</t>
        </z-callout>

        <z-callout data-x="300" data-y="200" data-speaker-x="500" data-speaker-y="200">
            <t>speaker-x="500"</t>
            <t>speaker-y="200"</t>
        </z-callout>

        <z-callout data-x="100" data-y="300" data-speaker-x="50" data-speaker-y="350">
            <t>speaker-x="50"</t>
            <t>speaker-y="350"</t>
        </z-callout>

        <z-callout data-x="300" data-y="300" data-speaker-x="500" data-speaker-y="350">
            <t>speaker-x="500"</t>
            <t>speaker-y="350"</t>
        </z-callout>

        <z-callout data-x="100" data-y="400" data-speaker-x="50" data-speaker-y="500">
            <t>speaker-x="50"</t>
            <t>speaker-y="500"</t>
        </z-callout>

        <z-callout data-x="300" data-y="400" data-speaker-x="500" data-speaker-y="500">
            <t>speaker-x="500"</t>
            <t>speaker-y="500"</t>
        </z-callout>


    </svg>
</body>

</html>
