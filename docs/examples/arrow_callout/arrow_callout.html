<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Arrow Callout Samples</title>
    <script src="../../scripts/graph_table_svg.js"></script>
    <script>
        window.onload = async () => {
            await GraphTableSVG.Options.openSVG();
            /* This comment is a landmark for data processing. */
        };
    </script>
</head>

<body>
    <svg id="main" width="1000px" height="600px" xmlns="http://www.w3.org/2000/svg" style="background:#e9e9e9;border:solid 1pt;" z-vba="true">
        
        <z-arrow-callout data-x="100" data-y="100" data-direction="up">
            <t>direction="up"</t>
        </z-arrow-callout>
        <z-arrow-callout data-x="100" data-y="200" data-direction="left">
            <t>direction="left"</t>
        </z-arrow-callout>
        <z-arrow-callout data-x="100" data-y="300" data-direction="right">
            <t>direction="right"</t>
        </z-arrow-callout>
        <z-arrow-callout data-x="100" data-y="400" data-direction="down">
            <t>direction="down"</t>
        </z-arrow-callout>
        
        <z-arrow-callout data-x="300" data-y="150" data-direction="up" data-arrow-neck-height="50" data-arrow-neck-width="40" data-arrow-head-width="60" data-arrow-head-height="80">
            <t>direction="up"</t>
            <t>arrow-neck-height="50"</t>
            <t>arrow-neck-width="40"</t>
            <t>arrow-head-height="60"</t>
            <t>arrow-head-width="80"</t>
        </z-arrow-callout>
        <z-arrow-callout data-x="300" data-y="450" data-direction="left" data-arrow-neck-height="50" data-arrow-neck-width="40" data-arrow-head-width="60" data-arrow-head-height="80">
            <t>direction="left"</t>
            <t>arrow-neck-height="50"</t>
            <t>arrow-neck-width="40"</t>
            <t>arrow-head-height="60"</t>
            <t>arrow-head-width="80"</t>
        </z-arrow-callout>
        <z-arrow-callout data-x="600" data-y="150" data-direction="right" data-arrow-neck-height="50" data-arrow-neck-width="40" data-arrow-head-width="60" data-arrow-head-height="80">
            <t>direction="right"</t>
            <t>arrow-neck-height="50"</t>
            <t>arrow-neck-width="40"</t>
            <t>arrow-head-height="60"</t>
            <t>arrow-head-width="80"</t>
        </z-arrow-callout>
        <z-arrow-callout data-x="700" data-y="350" data-direction="down" data-arrow-neck-height="50" data-arrow-neck-width="40" data-arrow-head-width="60" data-arrow-head-height="80">
            <t>direction="down"</t>
            <t>arrow-neck-height="50"</t>
            <t>arrow-neck-width="40"</t>
            <t>arrow-head-height="60"</t>
            <t>arrow-head-width="80"</t>
        </z-arrow-callout>

    </svg>
</body>

</html>
