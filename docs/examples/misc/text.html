<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Text Examples</title>
    <script src="../../scripts/graph_table_svg.js"></script>
    <script>
        window.onload = () => {
            GraphTableSVG.transpile("main");
            GraphTableSVG.updateLayout("main").then();
            /* This comment is a landmark for data processing. */
        };
    </script>
</head>

<body>
    <svg id="main" xmlns="http://www.w3.org/2000/svg" style="background:#e9e9e9;border:solid 1pt;" z-shrink="true">
        <z-rect data-x="0" data-y="100">z-rect</z-rect>
        
        <z-rect data-x="0" data-y="200">
            This is a pen.
            He is Tom.
        </z-rect>
        <z-rect data-x="0" data-y="300">
            <z-text>This is a pen.</z-text>
            <z-text>He is Tom.</z-text>
        </z-rect>
        <z-rect data-x="0" data-y="400">
            <z-text>This is a pen.</z-text>
            <z-text newline="false">He is Tom.</z-text>
        </z-rect>
        <z-rect data-x="0" data-y="500">
            <z-text>This is a pen.</z-text>
            <z-text style="font-size: 32pt;fill:red">He is Tom.</z-text>
            <z-text newline="false">hello!</z-text>
        </z-rect>
    
    </svg>
</body>

</html>
