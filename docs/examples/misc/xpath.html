<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Hello World! GraphTableSVG!</title>
    <script src="../../scripts/graph_table_svg.js"></script>
    <script>
        window.onload = async () => {
            await GraphTableSVG.updateAll("main");
            /* This comment is a landmark for data processing. */
        };
    </script>
</head>

<body>
    <svg id="main" xmlns="http://www.w3.org/2000/svg" width="300pt" height="300pt" style="background:#e9e9e9;border:solid 1pt;">
        <text id="text" x="100" y="100" transform="rotate(45 100 100)">
            hello world! hello world!
        </text>
        <line data-x1-xpath="number(//*[@id='text']/@x)+number(//*[@id='text']/@data-bounding-client-rect-width)" 
        data-x2-xpath="number(//*[@id='text']/@x)+number(//*[@id='text']/@data-bounding-client-rect-width)" y1="100" y2="300" stroke="#e74c3c"/>
    </svg>
</body>

</html>
