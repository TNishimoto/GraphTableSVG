<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Object Samples</title>
    <script src="../../scripts/graph_table_svg.js"></script>
    <script>
        window.onload = () => {
            GraphTableSVG.Options.openSVG();
            /* This comment is a landmark for data processing. */
        };
    </script>
</head>

<body>
    <svg id="main" width="600px" height="600px" style="background:#e9e9e9;border:solid 1pt;" xmlns="http://www.w3.org/2000/svg" z-vba="true">
        
        <z-rect data-cx="100" data-cy="100">z-rect</z-rect>
        <z-ellipse data-cx="100" data-cy="200">z-ellipse</z-ellipse>
        <z-callout data-x="200" data-y="100">z-callout</z-callout>
        <z-arrow-callout data-x="400" data-y="100">z-arrowcallout</z-arrow-callout>
        <z-edge x1="100" y1="300" x2="300" y2="300">z-edge</z-edge>
        <z-table data-cx="300" data-cy="400">
            <row>
                <cell>z-table</cell>
                <cell>hello1</cell>
                <cell>hello2</cell>
            </row>
            <row>
                <cell>hello3</cell>
                <cell>hello4</cell>
                <cell>hello5</cell>
            </row>
        </z-table>
        <z-graph data-cx="100" data-cy="400">
            <z-ellipse id="g1" data-cx="0" data-cy="0">z-graph</z-ellipse>
            <z-ellipse id="g2" data-cx="-50" data-cy="100"></z-ellipse>
            <z-ellipse id="g3" data-cx="50" data-cy="100"></z-ellipse>
            <z-edge begin-vertex="g1" end-vertex="g2"></z-edge>
            <z-edge begin-vertex="g1" end-vertex="g3"></z-edge>
        </z-graph>
    </svg>
</body>

</html>
