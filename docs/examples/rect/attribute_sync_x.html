<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>z-rect Attribute Samples(sync-x)</title>
    <script src="../../scripts/graph_table_svg.js"></script>
    <script>
        window.onload = async () => {
            await GraphTableSVG.updateAll("main");
            /* This comment is a landmark for data processing. */
        };
    </script>
</head>

<body>
    <svg id="main" xmlns="http://www.w3.org/2000/svg"  width="1800px" height="800px" style="background:#e9e9e9;border:solid 1pt;" z-vba="true">
        <z-rect id="obj1_1" data-x="300" data-y="50" data-width="150" data-height="150">
            <z-text>id=&quot;obj1_1&quot;</z-text>
        </z-rect>
        <z-rect id="obj1_2" data-x="0" data-y="250" data-width="100" data-height="100" sync-x-target="obj1_1" sync-x-source-position="left" sync-x-target-position="left">
            <z-text>sync-x-target=&quot;obj1_1&quot;</z-text>
            <z-text>sync-x-source-position=&quot;left&quot;</z-text>
            <z-text>sync-x-target-position=&quot;left&quot;</z-text>
        </z-rect>
        <z-rect id="obj1_3" data-x="0" data-y="400" data-width="100" data-height="100" sync-x-target="obj1_1" sync-x-source-position="center" sync-x-target-position="left">
            <z-text>sync-x-target=&quot;obj1_1&quot;</z-text>
            <z-text>sync-x-source-position=&quot;center&quot;</z-text>
            <z-text>sync-x-target-position=&quot;left&quot;</z-text>
        </z-rect>
        <z-rect id="obj1_4" data-x="0" data-y="550" data-width="100" data-height="100" sync-x-target="obj1_1" sync-x-source-position="right" sync-x-target-position="left">
            <z-text>sync-x-target=&quot;obj1_1&quot;</z-text>
            <z-text>sync-x-source-position=&quot;right&quot;</z-text>
            <z-text>sync-x-target-position=&quot;left&quot;</z-text>
        </z-rect>
        <line x1="300" y1="0" x2="300" y2="800" stroke-data-width="1" stroke="red"  />

        <z-rect id="obj2_1" data-x="800" data-y="50" data-width="150" data-height="150">
            <z-text>id=&quot;obj2_1&quot;</z-text>
        </z-rect>
        <z-rect id="obj2_2" data-x="0" data-y="250" data-width="100" data-height="100" sync-x-target="obj2_1" sync-x-source-position="left" sync-x-target-position="center">
            <z-text>sync-x-target=&quot;obj2_1&quot;</z-text>
            <z-text>sync-x-source-position=&quot;left&quot;</z-text>
            <z-text>sync-x-target-position=&quot;center&quot;</z-text>
        </z-rect>
        <z-rect id="obj2_3" data-x="0" data-y="400" data-width="100" data-height="100" sync-x-target="obj2_1" sync-x-source-position="center" sync-x-target-position="center">
            <z-text>sync-x-target=&quot;obj2_1&quot;</z-text>
            <z-text>sync-x-source-position=&quot;center&quot;</z-text>
            <z-text>sync-x-target-position=&quot;center&quot;</z-text>
        </z-rect>
        <z-rect id="obj2_4" data-x="0" data-y="550" data-width="100" data-height="100" sync-x-target="obj2_1" sync-x-source-position="right" sync-x-target-position="center">
            <z-text>sync-x-target=&quot;obj2_1&quot;</z-text>
            <z-text>sync-x-source-position=&quot;right&quot;</z-text>
            <z-text>sync-x-target-position=&quot;center&quot;</z-text>
        </z-rect>
        <line x1="875" y1="0" x2="875" y2="800" stroke-data-width="1" stroke="red"  />

        <z-rect id="obj3_1" data-x="1300" data-y="50" data-width="150" data-height="150">
            <z-text>id=&quot;obj3_1&quot;</z-text>
        </z-rect>
        <z-rect id="obj3_2" data-x="0" data-y="250" data-width="100" data-height="100" sync-x-target="obj3_1" sync-x-source-position="left" sync-x-target-position="right">
            <z-text>sync-x-target=&quot;obj3_1&quot;</z-text>
            <z-text>sync-x-source-position=&quot;left&quot;</z-text>
            <z-text>sync-x-target-position=&quot;right&quot;</z-text>
        </z-rect>
        <z-rect id="obj3_3" data-x="0" data-y="400" data-width="100" data-height="100" sync-x-target="obj3_1" sync-x-source-position="center" sync-x-target-position="right">
            <z-text>sync-x-target=&quot;obj3_1&quot;</z-text>
            <z-text>sync-x-source-position=&quot;center&quot;</z-text>
            <z-text>sync-x-target-position=&quot;right&quot;</z-text>
        </z-rect>
        <z-rect id="obj3_4" data-x="0" data-y="550" data-width="100" data-height="100" sync-x-target="obj3_1" sync-x-source-position="right" sync-x-target-position="right">
            <z-text>sync-x-target=&quot;obj3_1&quot;</z-text>
            <z-text>sync-x-source-position=&quot;right&quot;</z-text>
            <z-text>sync-x-target-position=&quot;right&quot;</z-text>
        </z-rect>
        <line x1="1450" y1="0" x2="1450" y2="800" stroke-data-width="1" stroke="red"  />

    </svg>
</body>

</html>
