<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>z-rect Style Attribute Samples(padding-top, padding-left, padding-right, padding-bottom)</title>
    <script src="../../scripts/graph_table_svg.js"></script>
    <script>
        window.onload = async () => {
            await GraphTableSVG.updateAll("main");
            /* This comment is a landmark for data processing. */
        };
    </script>
</head>

<body>
    <svg id="main" width="900px" height="900px" xmlns="http://www.w3.org/2000/svg"
        style="background:#e9e9e9;border:solid 1pt;">
        <z-rect data-x="100" data-y="100">
            <z-text>None</z-text>
        </z-rect>
        <z-rect data-x="100" data-y="200" style="--padding-top:50">
            <z-text>style=&quotpadding-top:50&quot</z-text>
        </z-rect>
        <z-rect data-x="100" data-y="300" style="--padding-left:50">
            <z-text>style=&quotpadding-left:50&quot</z-text>
        </z-rect>
        <z-rect data-x="100" data-y="400" style="--padding-right:50">
            <z-text>style=&quotpadding-right:50&quot</z-text>
        </z-rect>
        <z-rect data-x="100" data-y="500" style="--padding-bottom:50">
            <z-text>style=&quotpadding-bottom:50&quot</z-text>
        </z-rect>
        <z-rect data-x="400" data-y="200" style="--padding-top:50;--padding-left:50;--padding-right:50;--padding-bottom:50">
            <z-text>padding-top:50</z-text>
            <z-text>padding-left:50</z-text>
            <z-text>padding-right:50</z-text>
            <z-text>padding-bottom:50</z-text>
        </z-rect>
    </svg>
</body>

</html>
