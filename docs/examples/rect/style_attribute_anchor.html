<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>z-rect Style Attribute Samples(--horizontal-anchor, --vertical-anchor)</title>
    <script src="../../scripts/graph_table_svg.js"></script>
    <script>
        window.onload = async () => {
            await GraphTableSVG.updateAll("main");
            /* This comment is a landmark for data processing. */
        };
    </script>
</head>

<body>
    <svg id="main" width="900px" height="600px" xmlns="http://www.w3.org/2000/svg"
        style="background:#e9e9e9;border:solid 1pt;">
        <z-rect data-x="0" data-y="0" data-width="250" data-height="100" style="--horizontal-anchor:left">
            <z-text>--horizontal-anchor:left</z-text>
        </z-rect>
        <z-rect data-x="280" data-y="0" data-width="250" data-height="100" style="--horizontal-anchor:center">
            <z-text>--horizontal-anchor:center</z-text>
        </z-rect>
        <z-rect data-x="550" data-y="0" data-width="250" data-height="100" style="--horizontal-anchor:right">
            <z-text>--horizontal-anchor:right</z-text>
        </z-rect>
        <z-rect data-x="0" data-y="150" data-width="250" data-height="100" style="--vertical-anchor:top">
            <z-text>--vertical-anchor:top</z-text>
        </z-rect>
        <z-rect data-x="280" data-y="150" data-width="250" data-height="100" style="--vertical-anchor:middle">
            <z-text>--vertical-anchor:middle</z-text>
        </z-rect>
        <z-rect data-x="550" data-y="150" data-width="250" data-height="100" style="--vertical-anchor:bottom">
            <z-text>--vertical-anchor:bottom</z-text>
        </z-rect>
        <z-rect data-x="0" data-y="300" data-width="250" data-height="100" style="--vertical-anchor:top;--horizontal-anchor:left">
            <z-text>--vertical-anchor:top</z-text>
            <z-text>--horizontal-anchor:left</z-text>
        </z-rect>
        <z-rect data-x="280" data-y="300" data-width="250" data-height="100" style="--vertical-anchor:middle;--horizontal-anchor:center">
            <z-text>--vertical-anchor:middle</z-text>
            <z-text>--horizontal-anchor:center</z-text>
        </z-rect>
        <z-rect data-x="550" data-y="300" data-width="250" data-height="100" style="--vertical-anchor:bottom;--horizontal-anchor:right">
            <z-text>--vertical-anchor:bottom</z-text>
            <z-text>--horizontal-anchor:right</z-text>
        </z-rect>
    </svg>
</body>

</html>
