<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>z-rect Style Attribute Samples(--autosize-shape-to-fit-text)</title>
    <script src="../../scripts/graph_table_svg.js"></script>
    <script>
        window.onload = async () => {
            await GraphTableSVG.updateAll("main");
            /* This comment is a landmark for data processing. */
        };
    </script>
</head>

<body>
    <svg id="main" width="900px" height="900px" xmlns="http://www.w3.org/2000/svg"
        style="background:#e9e9e9;border:solid 1pt;">
        <z-rect data-x="50" data-y="100" data-width="250" data-height="250" style="--autosize-shape-to-fit-text:none">
            <z-text>width=&quot250&quot</z-text>
            <z-text>height=&quot250&quot</z-text>
            <z-text>style=&quot--autosize-shape-to-fit-text:none&quot</z-text>
        </z-rect>

        <z-rect data-x="50" data-y="400" data-width="250" data-height="250" style="--autosize-shape-to-fit-text:auto">
            <z-text>width=&quot250&quot</z-text>
            <z-text>height=&quot250&quot</z-text>
            <z-text>style=&quot--autosize-shape-to-fit-text:auto&quot</z-text>
        </z-rect>

        <z-rect data-x="50" data-y="600" data-width="250" data-height="250" style="--autosize-shape-to-fit-text:semi-auto">
            <z-text>width=&quot250&quot</z-text>
            <z-text>height=&quot250&quot</z-text>
            <z-text>style=&quot--autosize-shape-to-fit-text:semi-auto&quot</z-text>
        </z-rect>
    </svg>
</body>

</html>
